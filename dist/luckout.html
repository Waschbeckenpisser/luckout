<style>
/* Luckout v3 – ruhiges Glas-Design: Gegner oben, Automat in der Mitte, Relikt-Plätze und Dock unten. */
:root{
  /* Theme-Rohwerte (Klassik) – je Theme überschrieben, je Modus ausgewählt */
  --acc-l:#0071e3;--acc-d:#0a84ff;--acc2-l:#5e5ce6;--acc2-d:#7d7aff;
  --bg-l:#f2f2f7;--bg-d:#000000;
  --b1-l:#cfe2ff;--b2-l:#ffe2c6;--b3-l:#e9dcff;--b1-d:#0b2a55;--b2-d:#3a1f08;--b3-d:#24124a;
  --hp1:#ff6a3d;--hp2:#ff2d55;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.32,1.4,.55,1);--out:cubic-bezier(.16,1,.3,1);
  --cell:clamp(54px,min(21vw,8.6vh),100px);
  /* Hell */
  --accent:var(--acc-l);--accent-2:var(--acc2-l);--bg:var(--bg-l);--b1:var(--b1-l);--b2:var(--b2-l);--b3:var(--b3-l);
  --surface:rgba(255,255,255,.74);--surface-solid:#ffffff;--surface-2:rgba(255,255,255,.55);
  --well:rgba(118,118,128,.12);--well-2:rgba(118,118,128,.2);--hair:rgba(255,255,255,.75);--line:rgba(60,60,67,.12);--line-2:rgba(60,60,67,.2);
  --text:#1d1d1f;--text-2:#6e6e73;--text-3:#8e8e93;
  --red:#ff3b30;--green:#34c759;--green-t:#248a3d;--orange:#ff9500;--gold:#c78a00;--gold-2:#ffcc4d;
  --c0:#8e8e93;--c1:#30b050;--c2:#0a84ff;--c3:#af52de;--c4:#ff9500;--c5:#ff2d55;
  --reel:#ffffff;--reel-edge:rgba(0,0,0,.06);
  --sh-1:0 1px 1px rgba(0,0,0,.03),0 4px 14px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.04),0 18px 44px rgba(0,0,0,.09);
  --sh-3:0 30px 80px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.08);
  --scrim:rgba(20,20,26,.26);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --logo-img:block;--logo-txt:none;
  --accent:var(--acc-d);--accent-2:var(--acc2-d);--bg:var(--bg-d);--b1:var(--b1-d);--b2:var(--b2-d);--b3:var(--b3-d);
  --surface:rgba(30,30,32,.72);--surface-solid:#1c1c1e;--surface-2:rgba(44,44,46,.6);
  --well:rgba(118,118,128,.24);--well-2:rgba(118,118,128,.34);--hair:rgba(255,255,255,.1);--line:rgba(84,84,88,.45);--line-2:rgba(120,120,128,.5);
  --text:#f5f5f7;--text-2:#a1a1a6;--text-3:#8e8e93;
  --red:#ff453a;--green:#30d158;--green-t:#30d158;--orange:#ff9f0a;--gold:#ffcc4d;--gold-2:#ffe08a;
  --c0:#98989d;--c1:#30d158;--c2:#0a84ff;--c3:#bf5af2;--c4:#ff9f0a;--c5:#ff375f;
  --reel:#2c2c2e;--reel-edge:rgba(255,255,255,.06);
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 14px 40px rgba(0,0,0,.45);--sh-3:0 30px 90px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --logo-img:block;--logo-txt:none;
  --accent:var(--acc-d);--accent-2:var(--acc2-d);--bg:var(--bg-d);--b1:var(--b1-d);--b2:var(--b2-d);--b3:var(--b3-d);
  --surface:rgba(30,30,32,.72);--surface-solid:#1c1c1e;--surface-2:rgba(44,44,46,.6);
  --well:rgba(118,118,128,.24);--well-2:rgba(118,118,128,.34);--hair:rgba(255,255,255,.1);--line:rgba(84,84,88,.45);--line-2:rgba(120,120,128,.5);
  --text:#f5f5f7;--text-2:#a1a1a6;--text-3:#8e8e93;
  --red:#ff453a;--green:#30d158;--green-t:#30d158;--orange:#ff9f0a;--gold:#ffcc4d;--gold-2:#ffe08a;
  --c0:#98989d;--c1:#30d158;--c2:#0a84ff;--c3:#bf5af2;--c4:#ff9f0a;--c5:#ff375f;
  --reel:#2c2c2e;--reel-edge:rgba(255,255,255,.06);
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 14px 40px rgba(0,0,0,.45);--sh-3:0 30px 90px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.47 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;overflow-x:hidden;transition:background-color .5s var(--ease)}
.mm-note a{color:inherit;text-underline-offset:3px}
html,body{overscroll-behavior:none} /* kein Neuladen durch Ziehen am Handy */
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r0{--rc:var(--c0)}.r1{--rc:var(--c1)}.r2{--rc:var(--c2)}.r3{--rc:var(--c3)}.r4{--rc:var(--c4)}.r5{--rc:var(--c5)}.rx{--rc:var(--red)}
.em{font-family:var(--emoji)}
.s7{font-family:var(--font-r);font-weight:900;background:linear-gradient(180deg,#ff7a3d,#ff2d55);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em}
.eyebrow{font:600 13px/1.2 var(--font);color:var(--accent);margin:0;letter-spacing:.01em}
.sub{color:var(--text-2);margin:6px 0 0}
.num{font-variant-numeric:tabular-nums}

/* Umgebungslicht hinter dem Glas */
.amb{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;overflow:hidden;filter:blur(60px) saturate(1.1);opacity:.9}
.amb i{transition:background 1.2s;position:absolute;border-radius:50%;width:60vmax;height:60vmax;animation:amb 38s ease-in-out infinite alternate}
.amb i:nth-child(1){left:-6vmax;top:-10vmax;background:radial-gradient(circle,color-mix(in srgb,var(--b1) 50%,var(--ep1,var(--b1))) 0,transparent 66%)}
.amb i:nth-child(2){right:-14vmax;top:12vmax;background:radial-gradient(circle,color-mix(in srgb,var(--b2) 50%,var(--ep2,var(--b2))) 0,transparent 66%);animation-duration:46s;animation-delay:-12s}
.amb i:nth-child(3){left:18vmax;bottom:-18vmax;background:radial-gradient(circle,color-mix(in srgb,var(--b3) 50%,var(--ep3,var(--b3))) 0,transparent 66%);animation-duration:52s;animation-delay:-24s}
@keyframes amb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-4vmax) scale(1.08)}100%{transform:translate(-5vmax,5vmax) scale(.95)}}
.glass{background:var(--surface);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);box-shadow:var(--sh-2),inset 0 1px 0 var(--hair),inset 0 0 0 1px color-mix(in srgb,var(--text) 5%,transparent)}

/* Hauptmenü */
.mm{min-height:100dvh;display:grid;place-items:center;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.mm-in{width:min(880px,100%);display:grid;gap:22px;justify-items:center;text-align:center}
/* Wortmarke als Bild nur im Dunkeln (Bild hat dunklen Grund), sonst Schrift */
.logo img{display:var(--logo-img,none);width:min(100%,460px);height:auto;margin:0 auto;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 62% 68% at 50% 50%,#000 80%,transparent);mask-image:radial-gradient(ellipse 62% 68% at 50% 50%,#000 80%,transparent)}
.logo span{display:var(--logo-txt,inline);background:inherit;-webkit-background-clip:text;background-clip:text}
.display.logo{background-image:none}
.display.logo span{background-image:linear-gradient(100deg,var(--accent),var(--accent-2))}
.display.logo{font-family:"Bungee",var(--font-d);font-weight:400;letter-spacing:0;padding-bottom:.08em}
.display{font:700 clamp(46px,9vw,92px)/1 var(--font-d);letter-spacing:-.055em;margin:6px 0 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.mm-machine{cursor:pointer;transition:transform .35s var(--spring)}
.mm-machine:active{transform:scale(.97);transition-duration:.12s}
.mm-hint{margin:0;color:var(--text-2);font-size:15px;animation:hintIn .6s var(--out) 2.5s both}
.mm-theme{width:min(260px,100%)}
.mm-lang{width:min(360px,100%)}
.mm-lang button{padding:0 6px}
.mm-opts{display:grid;gap:10px;justify-items:center;width:min(340px,100%)}
.mm-name{font:600 17px var(--font);padding:8px 16px;border-radius:999px;background:var(--well)}
.mm-name small{color:var(--text-3)}
.mm-mode{width:100%}
.mm-level{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%;border-radius:16px;background:var(--well);min-height:56px}
.mm-level>button{height:56px;font:600 24px var(--font);color:var(--accent)}
.mm-level>button:disabled{color:var(--text-3)}
.mm-level small{display:block;color:var(--text-2);font-size:12.5px}
.mm-level b{font:700 17px var(--font-d)}
.mm-level.locked b{color:var(--text-3)}
.mm-links{display:flex;gap:18px;margin:-8px 0 0}
.mm-links button{color:var(--accent);font:600 14.5px var(--font)}
/* Story-Karten: ruhige Glaskarte, Antippen = weiter, Text erscheint wie getippt */
.story-card{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:tcIn .4s var(--out) both;cursor:pointer}
.story-card .sc-in{width:min(420px,100%);padding:28px 24px 20px;border-radius:30px;text-align:center}
.story-card .sc-e{font:64px/1 var(--emoji);margin-bottom:14px}
.story-card .sc-t{font:600 19px/1.45 var(--font);margin:0;min-height:3em}
.story-card .sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--text-3);font-size:13px}
.story-card .sc-skip{color:var(--accent);font:600 14px var(--font)}
.story-card.out{animation:tcOut .35s ease both}
.title-card .tc-sub{margin:12px auto 0;max-width:360px;color:var(--text-2);font-size:17px;line-height:1.4;animation:tcText .9s var(--out) .35s both}
.name-in{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--well);font:600 18px var(--font);color:var(--text)}
.diary{display:grid;gap:10px;margin-top:12px}
.diary>div{padding:12px 14px;border-radius:14px;background:var(--well)}
.diary small{color:var(--text-2);font-size:12.5px}
.diary p{margin:4px 0 0;font-size:15px;line-height:1.45}
.diary .lock p{color:var(--text-3)}
.scores{display:grid;margin-top:12px;border-radius:14px;background:var(--well);overflow:hidden}
.scores>div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.scores>div:last-child{border-bottom:0}
.scores small{display:block;color:var(--text-2);font-size:12px}
.scores b{font-variant-numeric:tabular-nums}
.title-card{position:fixed;inset:0;z-index:200;display:grid;place-content:center;padding:16px;text-align:center;background:var(--bg);animation:tcIn .45s var(--out) both}
.title-card .display{animation:tcText .9s var(--out) .1s both}
.title-card.out{animation:tcOut .5s ease both}
@keyframes hintIn{from{opacity:0;transform:translateY(6px)}}
@keyframes tcIn{from{opacity:0}}
@keyframes tcText{from{opacity:0;transform:scale(.96);filter:blur(8px)}}
@keyframes tcOut{to{opacity:0}}
.mm-note{color:var(--text-2);font-size:14px;margin:-6px 0 0;min-height:20px}

/* Spiel */
.g{max-width:600px;margin:0 auto;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
#btnSound.off .snd-on,#btnSound:not(.off) .snd-off{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:transform .3s var(--spring),background .2s}
.icon-btn.glass{box-shadow:var(--sh-1),inset 0 1px 0 var(--hair),inset 0 0 0 1px color-mix(in srgb,var(--text) 6%,transparent)}
.icon-btn:active{transform:scale(.9);transition-duration:.1s}
.icon-btn svg{width:19px;height:19px}
.chamber{display:grid;justify-items:center;gap:6px;min-width:0}
.chamber b{font:600 14px/1 var(--font);letter-spacing:-.01em}
.chamber b small{font-weight:500;color:var(--text-2)}
.track{display:flex;gap:4px;align-items:center}
.track i{width:12px;height:4px;border-radius:2px;background:var(--well-2);transition:background .4s,width .4s var(--ease)}
.track i.done{background:var(--accent)}
.track i.now{width:20px;background:var(--text)}
.track i.boss{background:color-mix(in srgb,var(--red) 40%,var(--well-2))}
.track i.boss.done{background:var(--red)}
.track i.fin{width:16px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

/* Gegner */
.foe{position:relative;border-radius:26px;padding:14px 16px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;overflow:hidden}
.foe::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--fc,var(--accent)) 14%,transparent),transparent 60%);transition:background .6s}
.foe.boss{--fc:var(--red)}
.foe.final{--fc:var(--gold)}
.foe-av{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:34px/1 var(--emoji);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--fc,var(--accent)) 10%,var(--surface-solid)),color-mix(in srgb,var(--fc,var(--accent)) 26%,var(--surface-solid)));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fc,var(--accent)) 35%,transparent),0 6px 16px color-mix(in srgb,var(--fc,var(--accent)) 22%,transparent);animation:idle 3.6s ease-in-out infinite;cursor:help}
.foe-av svg{width:48px;height:48px}
.foe-av.hit{animation:hit .42s var(--ease)}
.foe-av.dead{animation:die .7s var(--ease) forwards}
.foe-t{min-width:0;cursor:help}
.foe-t h2{margin:0;font:700 19px/1.15 var(--font-d);letter-spacing:-.025em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.foe-t p{margin:3px 0 0;color:var(--text-2);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ftag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font:700 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--fc) 15%,transparent);color:var(--fc)}
.foe-hp{text-align:right;align-self:start;padding-top:2px}
.foe-hp b{display:block;font:700 22px/1.05 var(--font-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.foe-hp small{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.hpbar{grid-column:1/-1;position:relative;height:10px;border-radius:99px;background:var(--well);overflow:hidden;margin-top:6px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit}
.hp-ghost{background:color-mix(in srgb,var(--text) 22%,transparent);transition:width .9s var(--ease) .35s}
.hp-fill{background:linear-gradient(90deg,var(--hp1),var(--hp2));transition:width .55s var(--out);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.foe.final .hp-fill{background:linear-gradient(90deg,var(--gold-2),var(--gold),#e2563b)}
.hpbar.heal .hp-fill{animation:healGlow .8s ease}
.dmg-pop{position:absolute;z-index:8;pointer-events:none;font:800 26px/1 var(--font-d);letter-spacing:-.03em;color:var(--text);text-shadow:0 2px 12px color-mix(in srgb,var(--bg) 70%,transparent);font-variant-numeric:tabular-nums;animation:dmgUp 1.25s var(--out) forwards}
.dmg-pop.heal{color:var(--green-t)}
.dmg-pop.big{font-size:34px;color:var(--hp2)}
.foe-phase{grid-column:1/-1;margin:6px 0 0;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font:600 12.5px/1.35 var(--font)}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:16px;padding:2px 8px 0}
.bank small,.mini-stat small{display:block;color:var(--text-2);font:500 12px/1.2 var(--font)}
.bank b{display:block;font:700 clamp(30px,8vw,38px)/1.05 var(--font-d);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.bank.bump b{animation:bump .5s var(--spring)}
.debt{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font:600 12px/1 var(--font);color:var(--red);cursor:pointer}
.mini-stat{text-align:right}
.mini-stat b{display:flex;align-items:center;justify-content:flex-end;gap:3px;font:700 18px/1.2 var(--font-d);font-variant-numeric:tabular-nums}
.hearts{color:var(--red)}
.hearts svg{width:19px;height:19px}
.sdots{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}
.sdots i{width:8px;height:8px;border-radius:50%;background:var(--well-2);transition:background .3s,transform .3s var(--spring)}
.sdots i.on{background:var(--accent)}
.sdots i.extra.on{background:var(--accent-2)}

/* Automat */
.machine{position:relative;border-radius:30px;padding:12px 12px 14px;display:grid;justify-items:center;gap:10px}
.machine.hit::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--red) 30%,transparent),transparent 70%);animation:flash .9s ease-out forwards}
.buffs{min-height:24px;width:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}

.chip.warn{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}

.reel::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(180deg,color-mix(in srgb,var(--reel) 10%,rgba(0,0,0,.09)),transparent 22%,transparent 78%,color-mix(in srgb,var(--reel) 10%,rgba(0,0,0,.09)));z-index:4}
.reel.tease{box-shadow:0 0 0 2.5px var(--orange),0 0 26px color-mix(in srgb,var(--orange) 50%,transparent)}
.strip{will-change:transform;transform:translate3d(0,0,0)}
.cell{height:var(--cell);display:grid;place-items:center;position:relative}
.sym{display:inline-block;font:calc(var(--cell)*.5)/1 var(--emoji);user-select:none;transition:opacity .35s var(--ease),filter .35s,transform .35s var(--ease);position:relative;z-index:1}
.sym.s7{font-size:calc(var(--cell)*.6);font-family:var(--font-r)}
.cell.win::before{content:"";position:absolute;inset:5px;border-radius:13px;background:color-mix(in srgb,var(--lc,var(--accent)) 13%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--lc,var(--accent)) 55%,transparent);animation:cellOn .45s var(--out) both;animation-delay:var(--d,0ms)}
.cell.win .sym{animation:symPop .6s var(--spring) both;animation-delay:var(--d,0ms)}
.reels.has-win .cell:not(.win):not(.devil):not(.taxed) .sym{opacity:.28;filter:saturate(.2)}
.cell.devil::before{content:"";position:absolute;inset:5px;border-radius:13px;background:color-mix(in srgb,var(--red) 16%,transparent);box-shadow:inset 0 0 0 2px var(--red);animation:cellOn .35s var(--out) both;animation-delay:var(--d,0ms)}
.cell.devil .sym{animation:devilShake .5s ease-in-out 2}
.cell.taxed::before{content:"";position:absolute;inset:5px;border-radius:13px;background:color-mix(in srgb,var(--text-3) 18%,transparent);box-shadow:inset 0 0 0 2px var(--text-3);animation:cellOn .35s var(--out) both}
.cell.magic::after{content:"✦";position:absolute;top:6px;right:8px;z-index:3;font:700 12px/1 var(--font);color:var(--accent-2);animation:chipIn .4s var(--spring)}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.lines path{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .5s var(--out) forwards;opacity:.9;filter:drop-shadow(0 0 4px color-mix(in srgb,currentColor 60%,transparent))}
.lines rect{fill:none;stroke:currentColor;stroke-width:2.5;stroke-dasharray:4 5;opacity:0;animation:fadeIn .4s var(--out) forwards}
.pat-label{position:absolute;left:50%;top:50%;z-index:7;padding:8px 15px;border-radius:999px;background:var(--surface);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--sh-3),inset 0 1px 0 var(--hair);font:700 17px/1 var(--font-d);letter-spacing:-.02em;white-space:nowrap;pointer-events:none;color:var(--text);animation:patPop 1.9s var(--out) forwards}

.result .neg{color:var(--red);font-weight:700}
.result .dmg{color:var(--text);font-weight:700}

/* Steuerung */
.controls{display:grid;gap:10px;justify-items:center}
.btn-spin{position:relative;width:min(100%,420px);height:58px;border-radius:999px;background:var(--accent);color:#fff;font:600 18px/1 var(--font-d);letter-spacing:-.012em;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .35s var(--spring),background .3s,box-shadow .3s,color .3s;font-variant-numeric:tabular-nums;overflow:hidden}

.sub-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:min(100%,420px)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;font:600 13.5px/1 var(--font);color:var(--text);background:var(--surface);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--sh-1),inset 0 1px 0 var(--hair),inset 0 0 0 1px color-mix(in srgb,var(--text) 6%,transparent);transition:transform .3s var(--spring),opacity .2s;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill:active:not(:disabled){transform:scale(.95);transition-duration:.1s}

.pill.warn{color:var(--red)}
.pill.acc{color:var(--accent)}

/* Relikt-Plätze */
.vault{border-radius:22px;padding:10px 12px 12px}

.slots{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font:clamp(17px,4.6vw,24px)/1 var(--emoji);min-width:0}
.slot.empty{box-shadow:inset 0 0 0 1.5px var(--line);background:color-mix(in srgb,var(--text) 2%,transparent)}
.slot.empty::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2)}

.tile.r5{background:linear-gradient(140deg,color-mix(in srgb,#ff9500 28%,var(--surface-solid)),color-mix(in srgb,#ff2d55 26%,var(--surface-solid)) 45%,color-mix(in srgb,#af52de 28%,var(--surface-solid)))}
.tile.rx{background:linear-gradient(150deg,color-mix(in srgb,var(--red) 22%,var(--surface-solid)),color-mix(in srgb,#1d1d1f 12%,var(--surface-solid)))}
.slots .tile{font-size:inherit;border-radius:12px}
.tile .s7{font-size:1.05em}
.tile.trig{animation:trig .7s var(--spring)}
.ov{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;padding:0 3px;border-radius:99px;background:var(--surface-solid);box-shadow:0 1px 3px rgba(0,0,0,.2);font:700 10px/16px var(--font);color:var(--rc);font-style:normal;text-align:center}

.mg.big{grid-template-columns:repeat(3,14px);gap:3px}

.curses{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

@media (min-width:1024px){
  :root{--cell:clamp(54px,11.2vh,112px)}

  #dock.dock{left:calc(50% + 196px);transform:none;width:264px;flex-wrap:wrap;justify-content:center;bottom:calc(20px + env(safe-area-inset-bottom,0px))}

  .slots{--cols:4!important}
  .slot,.slots .tile{font-size:27px}
}
body.shop-open #dock,body.no-dock #dock{display:none!important}
/* Dock */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-radius:26px;max-width:calc(100vw - 24px)}

.layer.box .scrim,.layer.end .scrim{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--surface-solid);border-radius:30px;box-shadow:var(--sh-3),inset 0 1px 0 var(--hair);padding:24px;animation:sheetIn .55s var(--out);outline:none;overscroll-behavior:contain}

.x-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);color:var(--text-2);flex:none;transition:transform .3s var(--spring)}

.dlg-body{color:var(--text-2);font-size:16px;line-height:1.5;margin-top:8px}
.dlg-body b{color:var(--text)}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font:600 15.5px/1 var(--font);background:var(--accent);color:#fff;transition:transform .3s var(--spring),filter .2s,opacity .2s;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}

.kv{display:grid;margin-top:12px;border-radius:16px;background:var(--well);padding:2px 14px}

.gift .rib{left:50%;top:16px;bottom:0;width:12px;margin-left:-6px;background:rgba(255,255,255,.92);z-index:3}

/* Farbton je Epoche: mischt sich in das Umgebungslicht (hell und dunkel) */

<main id="menuScreen" class="mm wrap">

      <div class="mm-level" id="mmLevel"><button data-d="-1" aria-label="Vorheriges Level" data-l-aria="Vorheriges Level">‹</button><div><small id="mmLvN"></small><b id="mmLvT"></b></div><button data-d="1" aria-label="Nächstes Level" data-l-aria="Nächstes Level">›</button></div>

  </div>
</main>

<main id="game" class="wrap" hidden>

    <header class="topbar">
      <button class="icon-btn glass" id="btnMenu" aria-label="Menü öffnen" data-l-aria="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></button>

      <p class="foe-phase" id="foePhase" hidden></p>
    </section>

    <section class="stats">

      <div class="reels" id="reels">

        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <svg class="lines" id="lines" aria-hidden="true"></svg>
      </div>
      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <section class="controls">
      <button class="btn-spin" id="btnSpin" data-l>Drehen</button>
      <div class="sub-row" id="subRow"></div>
    </section>

    <section class="vault glass" id="vault" aria-label="Deine Relikte" data-l-aria="Deine Relikte">

      <div class="slots" id="slots"></div>
      <div class="curses" id="curses" hidden></div>
    </section>
  </div>
</main>

const baseFor = n => nice(MODE.b1 * MODE.bg ** (n - 1));
const hpFor = (n, kind) => {
  let h = MODE.h1 * MODE.hg ** (Math.min(n, ROUNDS) - 1) * (n > ROUNDS ? MODE.endless ** (n - ROUNDS) : 1);
  if (kind === 'boss') h *= n <= 4 ? MODE.hb1 : MODE.hb; if (kind === 'final') h *= MODE.hf;

};

const skinC = {};
function skinned(ep, kind, key) {
  const id = ep + kind + key; if (skinC[id]) return skinC[id];
  const base = kind === 'boss' ? BOSSES[key] : MOBS[key], sk = EPOCHS[ep][kind === 'boss' ? 'bosses' : 'mobs'].find(x => x[0] === key);
  if (!sk || sk.length < 4) return (skinC[id] = base);
  const c = base.d.indexOf(':');
  return (skinC[id] = Object.assign({}, base, { n: sk[1], e: sk[2], d: c < 0 ? sk[3] : sk[3] + base.d.slice(c) }));
}

const CURSES = IT.filter(i => i.k === 'x').map(i => i.id);
function randCurse(st) { const p = CURSES.filter(id => !st.curses.includes(id)); return p.length ? pick(p) : null; }

/* ---------- Zufallsereignisse ---------- */
function giftC(st, odds) {
  const id = randItem(st, 'c', rollTier(odds)); if (!id) return tx('Nichts gefunden.');
  const r = take(st, id, true); if (r.hotFull) return { t: tx('{0} gefunden – Hotbar voll.', inm(id)), ask: id };
  return r.sold ? { t: tx('{0} gefunden – Hotbar voll, dafür +{1}.', inm(id), money(r.sold)) } : { t: tx('{0} liegt jetzt in deiner Hotbar.', inm(id)), hot: id };
}
function giftR(st, odds, asMsg) {
  const id = randItem(st, 'r', rollTier(odds)); if (!id) return asMsg ? { msg: tx('Keine Relikte mehr verfügbar.') } : tx('Nichts gefunden.');
  if (st.relics.length >= mods(st).slots) { if (asMsg) return { msg: tx('{0} gefunden – alle Plätze sind belegt.', inm(id)), pending: id }; const v = relicValue(st, id); st.bank += v; return { t: tx('{0} – kein Platz frei, verkauft für {1}.', inm(id), money(v)) }; }
  giveRelic(st, id); return asMsg ? { msg: tx('Neues Relikt: {0}', inm(id)), relic: id } : { t: tx('Neues Relikt: {0}.', inm(id)), relic: id };
}

function mobL(mob) { // wie E.mobDef(mob), aber mit übersetztem Namen und Regeltext

}

/* body.html: data-l = Textinhalt ist der Schlüssel, data-l-aria / data-l-ph = Schlüssel in aria-label / placeholder */
function applyL() {
  document.querySelectorAll('[data-l=""]').forEach(el => { const k = el.dataset.k || (el.dataset.k = el.textContent.trim()); el.textContent = L(k); });
  document.querySelectorAll('[data-l-aria]').forEach(el => el.setAttribute('aria-label', L(el.dataset.lAria)));
  document.querySelectorAll('[data-l-ph]').forEach(el => el.setAttribute('placeholder', L(el.dataset.lPh)));
}

  "Du startest mit 3 Spins pro Kampf, jeder kostet den Einsatz. Übrige Spins nimmst du in den nächsten Kampf mit. Mehr Spins gibt es per Relikt oder als Proviant im Basar – jeder Proviant kostet doppelt so viel wie der vorige. Nach 3 Nieten in Folge trifft der nächste Spin sicher.": "Empiezas con 3 tiradas por combate y cada una cuesta la apuesta. Las tiradas sobrantes pasan al siguiente combate. Hay más tiradas con reliquias o como provisiones en el bazar; cada provisión cuesta el doble que la anterior. Tras 3 fallos seguidos, la siguiente tirada acierta seguro.",
  "Linien und Muster": "Líneas y patrones",
  "3 gleiche Symbole in Reihe, Spalte oder Diagonale gewinnen. Muster wie Block, Welle, Kreuz und Winkel zahlen zusätzlich – Relikte schalten größere frei. Der Joker ersetzt alles.": "3 símbolos iguales en fila, columna o diagonal ganan. Patrones como bloque, ola, cruz y ángulo pagan además; las reliquias desbloquean otros mayores. El comodín sustituye a todo.",

  "Der Teufel stiehlt deinen Einsatz – und bildet er ein Muster, klaut er ein Vielfaches. Der Steuer-Opa 👴 nimmt dir 30 % deines Gewinns. Manchmal verflucht dich der Teufel auch.": "El diablo te roba la apuesta, y si forma un patrón, te roba muchas veces más. El Abuelo Hacienda 👴 se lleva el 30 % de tu premio. A veces el diablo también te maldice.",
  "Kisten": "Cofres",
  "Jeder besiegte Gegner hinterlässt eine Truhe, im Basar gibt es eine Händler-Kiste pro Besuch. Kisten werten sich zufällig auf und geben dir sofort einen Gegenstand – mit etwas Glück darfst du wählen.": "Cada rival derrotado deja un cofre, y en el bazar hay un cofre del mercader por visita. Los cofres mejoran al azar y te dan un objeto al instante; con algo de suerte puedes elegir.",
  "Relikt-Plätze": "Huecos de reliquias",
  "Du hast 8 Plätze für Relikte. Antippen zum Verkaufen, im Basar auch zum Tauschen. Ist alles voll, entscheidest du, was rausfliegt.": "Tienes 8 huecos para reliquias. Toca para vender; en el bazar, también para cambiar. Si todo está lleno, tú decides qué sale.",
  "Leihe dir Geld, wenn es knapp wird. Am Ende jedes Kampfes werden Zinsen fällig.": "Pide dinero si vas justo. Al final de cada combate vencen intereses.",
  "Leben und Bosse": "Vidas y jefes",

  "Level und Epochen": "Niveaux et époques",
  "Die Story führt durch {0} Epochen, von der Urzeit bis in die Zukunft. Jedes Level hat {1} Kämpfe, am Ende wartet der Champion der Epoche. Wer ihn besiegt, schaltet das nächste Level frei. Im Endlosmodus kommen Gegner aus allen Zeiten, bis du fällst.": "L'histoire traverse {0} époques, de la préhistoire au futur. Chaque niveau compte {1} combats ; à la fin, le champion de l'époque t'attend. Qui le bat débloque le niveau suivant. En mode infini, des adversaires de toutes les époques surgissent jusqu'à ta chute.",
  "Kämpfe und Gegner": "Combats et adversaires",
  "Jeder Gewinn trifft den Gegner in gleicher Höhe – bring sein Leben auf null. Viele Gegner haben eine Sonderregel.": "Chaque gain frappe l'adversaire à hauteur égale : fais tomber sa vie à zéro. Beaucoup d'adversaires ont une règle spéciale.",
  "Spins": "Tours",
  "Du startest mit 3 Spins pro Kampf, jeder kostet den Einsatz. Übrige Spins nimmst du in den nächsten Kampf mit. Mehr Spins gibt es per Relikt oder als Proviant im Basar – jeder Proviant kostet doppelt so viel wie der vorige. Nach 3 Nieten in Folge trifft der nächste Spin sicher.": "Tu commences avec 3 tours par combat, chacun coûte la mise. Les tours restants passent au combat suivant. Plus de tours : via des reliques ou en provisions au Bazar, chaque provision coûte le double de la précédente. Après 3 ratés d'affilée, le tour suivant est un coup sûr.",
  "Linien und Muster": "Lignes et motifs",
  "3 gleiche Symbole in Reihe, Spalte oder Diagonale gewinnen. Muster wie Block, Welle, Kreuz und Winkel zahlen zusätzlich – Relikte schalten größere frei. Der Joker ersetzt alles.": "3 symboles identiques en rangée, colonne ou diagonale gagnent. Des motifs comme Bloc, Vague, Croix et Équerre paient en plus ; les reliques en débloquent de plus grands. Le joker remplace tout.",
  "Teufel und Steuer-Opa": "Diable et Papy Impôts",
  "Der Teufel stiehlt deinen Einsatz – und bildet er ein Muster, klaut er ein Vielfaches. Der Steuer-Opa 👴 nimmt dir 30 % deines Gewinns. Manchmal verflucht dich der Teufel auch.": "Le Diable te vole ta mise, et s'il forme un motif, il en prend un multiple. Papy Impôts 👴 prélève 30 % de ton gain. Parfois, le Diable te maudit aussi.",
  "Kisten": "Coffres",
  "Jeder besiegte Gegner hinterlässt eine Truhe, im Basar gibt es eine Händler-Kiste pro Besuch. Kisten werten sich zufällig auf und geben dir sofort einen Gegenstand – mit etwas Glück darfst du wählen.": "Chaque adversaire vaincu laisse un coffre ; au Bazar, tu as un coffre du marchand par visite. Les coffres montent de rang au hasard et te donnent un objet immédiatement ; avec un peu de chance, tu peux choisir.",
  "Relikt-Plätze": "Places de reliques",
  "Du hast 8 Plätze für Relikte. Antippen zum Verkaufen, im Basar auch zum Tauschen. Ist alles voll, entscheidest du, was rausfliegt.": "Tu as 8 places pour les reliques. Touche pour vendre, et au Bazar aussi pour échanger. Quand tout est plein, c'est toi qui décides de ce qui part.",
  "Leihe dir Geld, wenn es knapp wird. Am Ende jedes Kampfes werden Zinsen fällig.": "Emprunte de l'argent quand les fonds manquent. À la fin de chaque combat, des intérêts sont dus.",
  "Leben und Bosse": "Vies et boss",
  "Gehen dir die Spins aus, musst du aufgeben: Das kostet ein Leben, dann geht es mit neuen Spins weiter. In Kampf 4 und 8 warten Bosse, in Kampf 12 der Champion der Epoche. Ab der Hälfte seines Lebens wird er wütend.": "Si tu n'as plus de tours, tu dois abandonner : cela coûte une vie, puis tu repars avec de nouveaux tours. Des boss t'attendent aux combats 4 et 8, le champion de l'époque au combat 12. À la moitié de sa vie, il s'énerve.",

// Story-Karten: Text erscheint wie getippt; Tippen zeigt ihn ganz, nochmal Tippen = weiter; Escape/„Überspringen“ beendet
function storyCards(list) {
  return new Promise(res => {
    let i = 0, timer = 0, full = true, txt = '';
    const el = document.createElement('div'); el.className = 'story-card'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = '<div class="sc-in glass"><div class="sc-e" aria-hidden="true"></div><p class="sc-t" aria-hidden="true"></p><p class="sr" aria-live="polite"></p><div class="sc-foot"><span class="sc-n"></span><button class="sc-skip">' + L('Überspringen') + '</button></div></div>';
    document.body.appendChild(el);
    const t = $('.sc-t', el);
    const done = () => { clearInterval(timer); removeEventListener('keydown', key, true); el.classList.add('out'); setTimeout(() => el.remove(), 350); res(); };
    const draw = () => {
      const [e, raw] = list[i]; txt = raw.replace(/\{name\}/g, NAME());
      $('.sc-e', el).textContent = e; $('.sr', el).textContent = txt; $('.sc-n', el).textContent = list.length > 1 ? `${i + 1} / ${list.length}` : '';
      clearInterval(timer);
      if (RM) { t.textContent = txt; full = true; return; }
      let k = 0; full = false; t.textContent = '';
      timer = setInterval(() => { k += 2; t.textContent = txt.slice(0, k); if (k >= txt.length) { clearInterval(timer); full = true; } }, 28);
    };
    const next = () => { if (!full) { clearInterval(timer); t.textContent = txt; full = true; return; } if (++i >= list.length) return done(); Snd.click(); draw(); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); done(); } else if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); next(); } };
    el.addEventListener('click', e => { if (e.target.closest('.sc-skip')) { Snd.click(); done(); } else next(); });
    addEventListener('keydown', key, true);
    draw();
  });
}

  const nr = E.IT.filter(i => i.k === 'r').length, nc = E.IT.filter(i => i.k === 'c').length, nx = E.IT.filter(i => i.k === 'x').length;
  setSheet(Ly, head(L('Kompendium'), L('{0} Gegenstände.', E.IT.length)) + `<p class="sub">${L('{0} Relikte, {1} Verbrauchsgegenstände und {2} Flüche des Teufels. Entdeckt: {3}.', nr, nc, nx, seen.size)}</p>
    <div class="cx-tools"><input id="cxq" type="search" placeholder="${L('Suchen, z. B. Joker oder Muster')}" autocomplete="off" aria-label="${L('Gegenstände durchsuchen')}"><div class="seg" id="cxKind" style="flex:1 1 300px"><button class="on" data-k="all">${L('Alle')}</button><button data-k="r">${L('Relikte')}</button><button data-k="c">${L('Verbrauchbar')}</button><button data-k="x">${L('Flüche')}</button></div><div class="chips" id="cxRar"><button class="on" data-r="-1">${L('Alle Seltenheiten')}</button>${RN.map((n, i) => `<button class="r${i}" data-r="${i}"><i></i>${rarName(i)}</button>`).join('')}</div></div>
    <div class="cx-grid" id="cxGrid"></div>`);
  const draw = () => {
    const ql = q.trim().toLowerCase();
    const list = E.IT.filter(it => (kind === 'all' || it.k === kind) && (rar < 0 || (it.k !== 'x' && it.r === rar)) && (!ql || (P(itemName(it)) + ' ' + P(itemDesc(it))).toLowerCase().includes(ql)));
    $('#cxGrid', Ly.sheet).innerHTML = list.map(it => `<div class="cx-item ${rcls(it)}">${tile(it)}<div><span class="rar">${rarTxt(it)} · ${kindTxt(it)}${seen.has(it.id) ? ` · <span class="seen">${L('entdeckt')}</span>` : ''}</span><b>${iname(it)}</b><p>${T(itemDesc(it))}</p></div></div>`).join('') || `<p class="sub">${L('Nichts gefunden.')}</p>`;
  };
  draw();
  $('#cxq', Ly.sheet).addEventListener('input', e => { q = e.target.value; draw(); });
  $('#cxKind', Ly.sheet).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; $$('#cxKind button', Ly.sheet).forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#cxRar', Ly.sheet).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rar = +b.dataset.r; $$('#cxRar button', Ly.sheet).forEach(x => x.classList.toggle('on', x === b)); draw(); });
}
function openHelp() {
  const Ly = layer('help', { dismiss: true });
  const steps = [
    ['🕰️', L('Level und Epochen'), L('Die Story führt durch {0} Epochen, von der Urzeit bis in die Zukunft. Jedes Level hat {1} Kämpfe, am Ende wartet der Champion der Epoche. Wer ihn besiegt, schaltet das nächste Level frei. Im Endlosmodus kommen Gegner aus allen Zeiten, bis du fällst.', E.LEVELS, E.ROUNDS)],
    ['⚔️', L('Kämpfe und Gegner'), L('Jeder Gewinn trifft den Gegner in gleicher Höhe – bring sein Leben auf null. Viele Gegner haben eine Sonderregel.')],
    ['🎰', L('Spins'), L('Du startest mit 3 Spins pro Kampf, jeder kostet den Einsatz. Übrige Spins nimmst du in den nächsten Kampf mit. Mehr Spins gibt es per Relikt oder als Proviant im Basar – jeder Proviant kostet doppelt so viel wie der vorige. Nach 3 Nieten in Folge trifft der nächste Spin sicher.')],
    ['✨', L('Linien und Muster'), L('3 gleiche Symbole in Reihe, Spalte oder Diagonale gewinnen. Muster wie Block, Welle, Kreuz und Winkel zahlen zusätzlich – Relikte schalten größere frei. Der Joker ersetzt alles.')],
    ['😈', L('Teufel und Steuer-Opa'), L('Der Teufel stiehlt deinen Einsatz – und bildet er ein Muster, klaut er ein Vielfaches. Der Steuer-Opa 👴 nimmt dir 30 % deines Gewinns. Manchmal verflucht dich der Teufel auch.')],
    ['🎁', L('Kisten'), L('Jeder besiegte Gegner hinterlässt eine Truhe, im Basar gibt es eine Händler-Kiste pro Besuch. Kisten werten sich zufällig auf und geben dir sofort einen Gegenstand – mit etwas Glück darfst du wählen.')],
    ['🗃️', L('Relikt-Plätze'), L('Du hast 8 Plätze für Relikte. Antippen zum Verkaufen, im Basar auch zum Tauschen. Ist alles voll, entscheidest du, was rausfliegt.')],
    ['💳', L('Kredit'), L('Leihe dir Geld, wenn es knapp wird. Am Ende jedes Kampfes werden Zinsen fällig.')],
    ['❤️', L('Leben und Bosse'), L('Gehen dir die Spins aus, musst du aufgeben: Das kostet ein Leben, dann geht es mit neuen Spins weiter. In Kampf 4 und 8 warten Bosse, in Kampf 12 der Champion der Epoche. Ab der Hälfte seines Lebens wird er wütend.')],
  ];
  setSheet(Ly, head(L('Anleitung'), L('So funktioniert\'s.')) + `<ol class="steps">${steps.map(([e, t, d]) => `<li><span class="st-ico">${e}</span><div><b>${t}</b><p>${d}</p></div></li>`).join('')}</ol><p class="keys">${L('<kbd>Leertaste</kbd> Drehen <kbd>1–9</kbd> Hotbar <kbd>I</kbd> Infos <kbd>M</kbd> Menü')}</p>`);
}

/* ---------- Eingaben ---------- */
$('#mmMachine').addEventListener('click', play);
$('#mmLang').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b && !busy) { setLanguage(b.dataset.g); Snd.click(); } });
$('#mmTheme').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { applyTheme(b.dataset.t); Snd.click(); } });
$('#mmName').addEventListener('click', async () => { if (busy) return; Snd.click(); await askName(false); drawMenuOpts(); });
$('#mmMode').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b || busy) return; META.mode = b.dataset.m; saveMeta(); Snd.click(); drawMenuOpts(); });
$('#mmLevel').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b || b.disabled || busy) return; META.sel += +b.dataset.d; saveMeta(); Snd.click(); drawMenuOpts(); });
$('#mmDiary').addEventListener('click', () => { if (busy) return; Snd.click(); openDiary(); });
$('#mmScores').addEventListener('click', () => { if (busy) return; Snd.click(); openScores(); });
$('#btnSpin').addEventListener('click', () => {
  Snd.unlock(); if (busy || !S) return;
  const a = $('#btnSpin').dataset.act;
  if (a === 'loan') openLoan(); else if (a === 'giveup') giveUpFlow(); else doSpin();
});
$('#subRow').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return; Snd.click(); const a = b.dataset.a; if (a === 'giveup') giveUpFlow(); else if (a === 'loan') openLoan(); else if (a === 'auto') { auto = !auto; clearTimeout(autoT); renderControls(); if (auto) autoStep(); } });
$('#btnMenu').addEventListener('click', () => { Snd.click(); openMenu(); });
// Sprache wechseln: speichern und alles sofort neu zeichnen (Menü bzw. Spiel, offene Basar-Ebene)
function setLanguage(c) {
  META.lang = c; saveMeta(); setLang(c); applyL();
  if (S) { renderAll(true); if (shopL) drawShop(); } else drawMenuOpts();
}
const syncSound = () => { $('#btnSound').classList.toggle('off', !META.sound); $('#btnSound').setAttribute('aria-pressed', META.sound); };
syncSound();
$('#btnSound').addEventListener('click', () => { META.sound = !META.sound; saveMeta(); syncSound(); Snd.click(); });
$('#btnInfo').addEventListener('click', () => { Snd.click(); openInfo(); });
$('#sDebt').addEventListener('click', () => { Snd.click(); openLoan(); });
$('#foe').addEventListener('click', e => { const t = e.target.closest('[data-tip]'); if (t) tapTip(t); });
$('#vault').addEventListener('click', e => {
  if (!S) return;
  const r = e.target.closest('[data-idx]'); if (r) return relicMenu(+r.dataset.idx, r);
  const c = e.target.closest('[data-cidx]'); if (c) return curseMenu(+c.dataset.cidx, c);
});
const dock = $('#dock');
dock.addEventListener('click', e => { const b = e.target.closest('[data-slot]'); if (b) { b.classList.remove('used'); void b.offsetWidth; b.classList.add('used'); useSlot(+b.dataset.slot); } });
dock.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || RM) return; $$('.dock-item', dock).forEach(el => { const r = el.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)), s = 1 + .36 * Math.max(0, 1 - d / 110); el.style.transform = `translateY(${-(s - 1) * 22}px) scale(${s})`; }); });
dock.addEventListener('pointerleave', () => $$('.dock-item', dock).forEach(el => { el.style.transform = ''; }));
document.addEventListener('pointerdown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('#dock') && !e.target.closest('#vault') && !e.target.closest('[data-mine]') && !e.target.closest('[data-hot]')) closePop(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input[type="search"], textarea')) return;
  const top = [...$$('.layer')].pop();
  if (top) { if (e.key === 'Escape' && top._dismiss) top._dismiss(); return; }
  if (e.key === 'Escape') { closePop(); return; }
  if ($('#game').hidden) { if ((e.key === 'Enter' || e.code === 'Space') && !$('#menuScreen').hidden && !e.target.closest('button')) { e.preventDefault(); play(); } return; }
  if (!S || $('.intro, .story-card, .title-card')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#btnSpin').click(); }
  else if (/^[1-9]$/.test(e.key)) useSlot(+e.key - 1);
  else if (e.key === 'i' || e.key === 'I') openInfo();
  else if (e.key === 'm' || e.key === 'M') openMenu();
});

/* ---------- Start ---------- */
// Testhaken: tests/e2e.js setzt window.__dfTest = { run }, um Startzustände einzuspielen
if (window.__dfTest) window.__snap = () => ({ run: S && (S.phase === 'play' || S.phase === 'shop') ? S : null });
store.del('run'); // Läufe werden nicht mehr gespeichert, alte Stände aufräumen
applyTheme(META.theme); applyL();
function boot(data) { if (data && validRun(data.run)) resume(data.run); else renderMenu(); }
boot(window.__dfTest || {});
})();

</script>

</body>
</html>
